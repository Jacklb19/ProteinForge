# Browser stubs from the backend contracts, pinned to a backend commit. Regenerate with:
# npx buf generate   (backend commit must be published first)
# For unpublished sibling contracts: npx buf generate ../backend/proto
version: v2
clean: true
inputs:
  - git_repo: https://github.com/Jacklb19/Protein_Back.git
    ref: c2d127c3ea4ed8af91b3cace9fcebd8390129a52
    subdir: proto
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=none
