AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Plantilla de infraestructura base para alojamiento de SPA (S3 + CloudFront + OAC + ResponseHeadersPolicy)

Parameters:
  Environment:
    Type: String
    Default: preprod
    AllowedValues:
      - preprod
      - prod
    Description: Entorno de despliegue (preprod o prod).

  AppName:
    Type: String
    Default: web-app-template
    Description: Identificador del proyecto para nombrar recursos.

Resources:
  # Bucket privado para los archivos estáticos de la aplicación
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Política de bucket que permite el acceso exclusivamente a CloudFront vía OAC
  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AppBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AppDistribution}

  # Control de acceso de origen (Origin Access Control - OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AppName}-${Environment}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Política de cabeceras de respuesta (seguridad estricta y aislamiento de origen cruzado)
  AppResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AppName}-${Environment}-headers-policy
        Comment: Cabeceras de seguridad y aislamiento COOP/COEP para Web Workers y SharedArrayBuffer
        CustomHeadersConfig:
          Items:
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Embedder-Policy
              Value: require-corp
              Override: true
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            # CSP mínima documentada: incluye wasm-unsafe-eval para WebAssembly y worker-src para Web Workers
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"

  # Distribución de CloudFront para entrega global con terminación HTTPS
  # NOTA DE SEGURIDAD / LIMITACIÓN:
  # Al usar el dominio por defecto de CloudFront (*.cloudfront.net), AWS no permite configurar MinimumProtocolVersion (TLS 1.2+).
  # Para forzar TLSv1.2_2021 de forma estricta se requiere asociar un dominio personalizado con certificado emitido en ACM (us-east-1).
  AppDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Distribución estática para ${AppName} (${Environment})
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt AppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ResponseHeadersPolicyId: !Ref AppResponseHeadersPolicy
          # AWS Managed-CachingOptimized CachePolicyId
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          # Soporte de enrutamiento para Single Page Applications (SPA)
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  AppBucketName:
    Description: Nombre del bucket S3 para alojar los artefactos estáticos
    Value: !Ref AppBucket

  CloudFrontDistributionId:
    Description: Identificador de la distribución de CloudFront
    Value: !Ref AppDistribution

  CloudFrontDomainName:
    Description: Dominio asignado por CloudFront
    Value: !GetAtt AppDistribution.DomainName

  AppUrl:
    Description: URL pública de la aplicación
    Value: !Sub https://${AppDistribution.DomainName}
